<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>毛豆速记本</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin:0; padding:0; height:100%; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
       background:#f4f5f7; color:#1f2329; font-size:16px; }
/* 顶部固定区 */
.top { position:fixed; top:0; left:0; right:0; z-index:30; background:#1e6fff; color:#fff; }
.top .title { height:44px; line-height:44px; padding:0 12px; font-size:17px; font-weight:600; display:flex; align-items:center; }
.menu-btn { font-size:20px; padding:0 10px 0 2px; cursor:pointer; user-select:none; }
.tabs { display:flex; flex-wrap:nowrap; background:#1e6fff; padding:0 6px 8px; }
.tab { flex:1 1 0; padding:8px 0; margin:0 2px; border:none; border-radius:14px; text-align:center;
       background:rgba(255,255,255,.18); color:#fff; font-size:13px; cursor:pointer; white-space:nowrap; touch-action:manipulation; }
.tab.active { background:#fff; color:#1e6fff; font-weight:700; }
/* 搜索行 */
.search { position:fixed; top:96px; left:0; right:0; z-index:29; background:#fff;
          padding:8px 12px; box-shadow:0 1px 4px rgba(0,0,0,.06); display:flex; }
.search input { flex:1; height:38px; border:1px solid #dcdfe6; border-radius:8px 0 0 8px;
                padding:0 12px; font-size:15px; outline:none; }
.search button { width:64px; height:38px; border:none; border-radius:0 8px 8px 0;
                 background:#1e6fff; color:#fff; font-size:15px; cursor:pointer; }
/* 目录面板（全屏展开，不用动画，兼容旧机） */
.toc-panel { display:none; position:fixed; top:0; left:0; right:0; bottom:0; z-index:40; background:#fff; }
.toc-panel.on { display:block; }
.toc-panel .tp-head { height:44px; line-height:44px; padding:0 14px; font-size:16px; font-weight:700; color:#1e6fff; border-bottom:1px solid #eee; display:flex; align-items:center; }
.toc-panel .tp-close { margin-left:auto; font-size:22px; color:#999; cursor:pointer; padding:0 4px; }
.toc-panel .tp-body { position:absolute; top:45px; bottom:0; left:0; right:0; overflow-y:auto; padding:6px 0; -webkit-overflow-scrolling:touch; }
.toc-panel .toc-item { display:block; padding:12px 18px; font-size:15px; color:#333; border-bottom:1px solid #f5f5f5; cursor:pointer; }
.toc-panel .toc-item:active { background:#eef3ff; color:#1e6fff; }
.toc-panel .toc-ch { font-weight:700; }
.toc-panel .toc-ch .arrow { display:inline-block; margin-right:6px; transition:transform .2s; font-size:12px; color:#999; }
.toc-panel .toc-ch.open .arrow { transform:rotate(90deg); }
.toc-panel .toc-jie-wrap { padding:0; }
.toc-panel .toc-jie { padding:10px 18px 10px 34px; font-size:14px; color:#555; border-bottom:1px solid #fafafa; cursor:pointer; }
.toc-panel .toc-jie:active { background:#eef3ff; color:#1e6fff; }
/* 内容区 */
.content { padding-top:144px; height:100%; overflow-y:auto; }
.inner { max-width:760px; margin:0 auto; padding:12px; }
.panel { display:none; }
.panel.on { display:block; }
.panel h2 { color:#1e6fff; font-size:19px; border-left:4px solid #1e6fff; padding-left:10px; }
.panel section { background:#fff; border-radius:10px; padding:14px; margin-bottom:12px; }
.panel section h3 { margin:0 0 10px; font-size:16px; color:#1f2329; }
.jie { margin-bottom:10px; }
.jie-t { font-weight:700; font-size:14px; color:#1e6fff; background:#f0f5ff; border-radius:6px; padding:6px 10px; margin-bottom:6px; }
.panel section.hit { border:2px solid #ff9500; }
.kp { padding:8px 0; border-bottom:1px dashed #eee; }
.kp:last-child { border-bottom:none; }
.kp-t { font-weight:700; margin-bottom:4px; font-size:15px; }
.kp-c { color:#4b5563; line-height:1.7; font-size:15px; word-break:break-word; }
/* ===== 公式排版（手写 HTML/CSS，纯离线稳定） ===== */
.fx { display:inline-flex; flex-direction:column; vertical-align:middle; text-align:center; margin:0 2px; line-height:1.15; }
.fx .num { padding:0 3px; border-bottom:1.5px solid #1f2329; }
.fx .den { padding:0 3px; }
.rt { display:inline-flex; align-items:center; }
.rt .rt-sym { font-size:1.1em; }
.rt .rt-in { border-top:1.5px solid #1f2329; padding:0 2px 0 0; margin-left:-2px; }
.f-math { font-family:Georgia,'Times New Roman',serif; font-style:normal; }
.f-math i, .f-math var { font-style:italic; }
.w { display:flex; flex-wrap:wrap; align-items:baseline; padding:6px 0; border-bottom:1px solid #f0f0f0; }
.w:last-child { border-bottom:none; }
.w .wd { font-weight:700; font-size:15px; color:#1f2329; min-width:90px; }
.w .ph { color:#8a94a6; font-size:13px; margin-right:8px; }
.w .ps { color:#1e6fff; font-size:12px; margin-right:8px; }
.w .mn { color:#4b5563; font-size:14px; flex:1; min-width:100%; margin-top:2px; display:none; }
.w.open .mn { display:block; }
.full { color:#333; line-height:2; font-size:16px; white-space:pre-wrap; }
.empty { color:#8a94a6; text-align:center; padding:40px 0; }
/* AI 问答 板块 */
.qa-ask textarea { width:100%; height:120px; border:1px solid #dcdfe6; border-radius:8px;
                   padding:10px; font-size:15px; resize:none; outline:none; }
.qa-bar { display:flex; gap:10px; margin-top:10px; }
.qa-bar .mic { flex:1; height:40px; border:none; border-radius:8px; background:#5ac8fa; color:#fff; font-size:15px; cursor:pointer; }
.qa-bar .send { flex:1; height:40px; border:none; border-radius:8px; background:#1e6fff; color:#fff; font-size:15px; cursor:pointer; }
.qa-tip { margin-top:10px; font-size:13px; color:#8a94a6; min-height:18px; }
.qa-list { margin-top:14px; }
.qa-item { margin-bottom:14px; }
.qa-item .qa-q { background:#eef3ff; border-radius:10px; padding:10px 12px; font-size:14px; color:#1f2329; text-align:right; }
.qa-item .qa-a { background:#f8f9fb; border-radius:10px; padding:12px; font-size:14px; color:#333; line-height:1.7; margin-top:6px; white-space:pre-wrap; word-break:break-word; }
.qa-item .qa-a.ai-thinking { color:#8a94a6; font-style:italic; }
.qa-item .qa-a .m { color:#1e6fff; font-family:Georgia,'Times New Roman',serif; }
.qa-item .qa-time { font-size:11px; color:#b0b5bd; margin-top:4px; }
</style>

<script>
var tabs = document.getElementById('tabs');
var panels = document.querySelectorAll('.panel');
var q = document.getElementById('q');
var content = document.getElementById('content');
var tocPanel = document.getElementById('tocPanel');
var tocBody = document.getElementById('tocBody');
var tpTitle = document.getElementById('tpTitle');
var cur = '数学';

// base64 解码（支持中文，UTF-8）——不用 TextDecoder，兼容旧 WebView
function b64Decode(b64) {
  var bin = atob(b64);
  var out = '';
  var i = 0;
  while (i < bin.length) {
    var c1 = bin.charCodeAt(i++);
    if (c1 < 0x80) {
      out += String.fromCharCode(c1);
    } else if (c1 < 0xE0) {
      out += String.fromCharCode(((c1 & 0x1F) << 6) | (bin.charCodeAt(i++) & 0x3F));
    } else if (c1 < 0xF0) {
      out += String.fromCharCode(((c1 & 0x0F) << 12) | ((bin.charCodeAt(i++) & 0x3F) << 6) | (bin.charCodeAt(i++) & 0x3F));
    } else {
      var cp = ((c1 & 0x07) << 18) | ((bin.charCodeAt(i++) & 0x3F) << 12) | ((bin.charCodeAt(i++) & 0x3F) << 6) | (bin.charCodeAt(i++) & 0x3F);
      cp -= 0x10000;
      out += String.fromCharCode(0xD800 + (cp >> 10), 0xDC00 + (cp & 0x3FF));
    }
  }
  return out;
}

// 懒加载 + 单科渲染：DOM 里永远只有当前科，切走就清空，防止内容累积而拖慢
var renderedCache = {};   // 已解码的 HTML 字符串缓存（只存字符串，不存 DOM 节点）
function getHtml(name) {
  if (renderedCache[name]) return renderedCache[name];
  var raw = SUBJ_HTML[name];
  if (raw) renderedCache[name] = b64Decode(raw);
  return renderedCache[name] || '';
}
function ensurePanel(name) {
  var p = document.getElementById('panel-' + name);
  var html = getHtml(name);
  if (p && html && p.innerHTML === '') {
    p.innerHTML = html;
  }
}
// 切走时清空其他科的 DOM（只留当前科），避免全科内容同时堆在 DOM 里
// 注意：AI问答面板（动态问答列表）不清理，保持其 DOM 稳定
function clearOtherPanels(name) {
  for (var j=0;j<panels.length;j++) {
    if (panels[j].id !== 'panel-' + name && panels[j].id !== 'panel-AI问答') {
      panels[j].innerHTML = '';
    }
  }
}

function switchTo(name) {
  var btns = tabs.querySelectorAll('.tab');
  for (var i=0;i<btns.length;i++) {
    if (btns[i].getAttribute('data-subj') === name) btns[i].classList.add('active');
    else btns[i].classList.remove('active');
  }
  for (var j=0;j<panels.length;j++) {
    if (panels[j].id === 'panel-' + name) panels[j].classList.add('on');
    else panels[j].classList.remove('on');
  }
  cur = name;
  q.value = '';
  // 先注入目标科内容（异步、可缓存），再清空其他科（单科渲染，避免 DOM 累积）
  ensurePanel(name);
  clearOtherPanels(name);
  // 特殊面板（AI问答）隐藏搜索框，学科面板显示搜索框
  var searchBar = document.querySelector('.search');
  if (name === 'AI问答') {
    searchBar.style.display = 'none';
  } else {
    searchBar.style.display = 'flex';
    // 搜索框已清空，无需重新搜索/遍历 DOM（避免切换慢）
    searchTerm = '';
    searchMatches = [];
    searchIndex = 0;
  }
  content.scrollTop = 0;
}

function getSecs() {
  return document.getElementById('panel-' + cur).querySelectorAll('section.sec');
}

// 重建当前科目录（支持章→节 折叠树）
function rebuildToc() {
  var secs = getSecs();
  var html = '';
  for (var i=0;i<secs.length;i++) {
    var t = secs[i].getAttribute('data-t') || ('条目 ' + (i+1));
    var jies = secs[i].querySelectorAll('.jie');
    if (jies.length > 0) {
      // 章 → 节 折叠树
      html += '<div class="toc-ch" data-sec="' + i + '" data-toggle="1"><span class="arrow">▶</span>' + t + '</div>';
      var jieHtml = '';
      for (var j=0;j<jies.length;j++) {
        var jt = jies[j].getAttribute('data-t') || ('节 ' + (j+1));
        jieHtml += '<div class="toc-jie" data-sec="' + i + '" data-jie="' + j + '">' + jt + '</div>';
      }
      html += '<div class="toc-jie-wrap" style="display:none">' + jieHtml + '</div>';
    } else {
      // 无节：直接是章
      html += '<div class="toc-item" data-sec="' + i + '">' + t + '</div>';
    }
  }
  tocBody.innerHTML = html;
  tpTitle.textContent = cur + ' · 目录（' + secs.length + ' 章）';
}

// 打开/关闭目录面板
function openToc() { rebuildToc(); tocPanel.classList.add('on'); }
function closeToc() { tocPanel.classList.remove('on'); }
document.getElementById('menuBtn').addEventListener('click', openToc);
document.getElementById('tpClose').addEventListener('click', closeToc);

// 目录点击：带 data-toggle 的章→折叠/展开节；data-jie 的节→跳转；普通章→跳转
tocBody.addEventListener('click', function(e) {
  var el = e.target;
  while (el && el !== tocBody && !el.getAttribute) el = el.parentNode;
  // 向上找最近的带 data-toggle 的元素（章头）
  var ch = e.target;
  while (ch && ch !== tocBody && ch.getAttribute && ch.getAttribute('data-toggle') !== '1') ch = ch.parentNode;
  if (ch && ch !== tocBody && ch.getAttribute && ch.getAttribute('data-toggle') === '1') {
    var wrap = ch.nextElementSibling;
    var isOpen = ch.classList.contains('open');
    if (isOpen) {
      ch.classList.remove('open');
      if (wrap) wrap.style.display = 'none';
    } else {
      ch.classList.add('open');
      if (wrap) wrap.style.display = 'block';
    }
    return;
  }
  // 向上找最近的带 data-jie 的元素（节）
  var jie = e.target;
  while (jie && jie !== tocBody && jie.getAttribute && jie.getAttribute('data-jie') === null) jie = jie.parentNode;
  if (jie && jie !== tocBody && jie.getAttribute && jie.getAttribute('data-jie') !== null) {
    var sidx = parseInt(jie.getAttribute('data-sec'), 10);
    var jidx = parseInt(jie.getAttribute('data-jie'), 10);
    var secs = getSecs();
    if (secs[sidx]) {
      var jies = secs[sidx].querySelectorAll('.jie');
      if (jies[jidx]) {
        closeToc();
        setTimeout(function(){ jies[jidx].scrollIntoView(); }, 30);
      }
    }
    return;
  }
  // 普通章（无节）
  var item = e.target;
  while (item && item !== tocBody && (item.getAttribute === undefined || item.getAttribute('data-sec') === null)) item = item.parentNode;
  if (item && item !== tocBody && item.getAttribute && item.getAttribute('data-sec') !== null) {
    var idx = parseInt(item.getAttribute('data-sec'), 10);
    var secs2 = getSecs();
    if (secs2[idx]) {
      closeToc();
      setTimeout(function(){ secs2[idx].scrollIntoView(); }, 30);
    }
  }
});

tabs.addEventListener('click', function(e) {
  var t = e.target;
  if (t && t.getAttribute('data-subj')) switchTo(t.getAttribute('data-subj'));
});

// 英语单词释义：点击切换 .open class（默认隐藏，CSS 控制，无遍历）
function resetEnglishMn() {
  // 懒加载改版后不再需要遍历重置：通过 CSS .mn{display:none} 默认隐藏，
  // 每次重新渲染英语 DOM 时天然恢复为隐藏状态。这里保留空函数以备兼容。
}
document.getElementById('inner').addEventListener('click', function(e) {

  while (w && w !== document && !(w.classList && w.classList.contains('w'))) w = w.parentNode;

// 搜索 = 定位模式：不隐藏任何内容，只高亮匹配项并逐个跳转
var searchMatches = [];
var searchIndex = 0;
var searchTerm = '';

function findMatches() {
  var v = q.value.trim().toLowerCase();
  searchMatches = [];
  searchIndex = 0;
  searchTerm = v;
  clearHl();
  if (v === '') { return; }
  var secs = getSecs();
  for (var i=0;i<secs.length;i++) {
    var rows = secs[i].querySelectorAll('.kp, .w');
    if (rows.length > 0) {
      for (var r=0;r<rows.length;r++) {
        if (rows[r].textContent.toLowerCase().indexOf(v) !== -1) {
          searchMatches.push(rows[r]);
        }
      }
    } else {
      // 无 .kp/.w 的 section（语文篇、占位），整块匹配
      if (secs[i].textContent.toLowerCase().indexOf(v) !== -1) {
        searchMatches.push(secs[i]);
      }
    }
  }
}

function jumpToMatch() {
  if (searchTerm === '') { return; }
  if (searchMatches.length === 0) {
    findMatches();
    if (searchMatches.length === 0) { return; }
  }
  // 清除上一个高亮
  clearHl();
  var el = searchMatches[searchIndex % searchMatches.length];
  el.scrollIntoView();
  el.style.background = '#ffd166';
  searchIndex++;
}

function doSearch() {
  // 每点一次搜索：定位到下一个匹配（不隐藏其他内容）
  var v = q.value.trim().toLowerCase();
  if (v !== searchTerm) {
    // 关键词变了，重新收集匹配
    searchTerm = v;
    searchMatches = [];
    searchIndex = 0;
    findMatches();
  }
  if (v === '') {
    clearHl();
    content.scrollTop = 0;
    return;
  }
  if (searchMatches.length === 0) {
    clearHl();
    return;
  }
  clearHl();
  var el = searchMatches[searchIndex % searchMatches.length];
  el.scrollIntoView();
  el.style.background = '#ffd166';
  searchIndex++;
}

function clearHl() {
  var hs = document.querySelectorAll('.kp, .w, section.sec');
  for (var i=0;i<hs.length;i++) { hs[i].style.background=''; }
}
document.getElementById('searchBtn').addEventListener('click', doSearch);
q.addEventListener('keydown', function(e){ if(e.key === 'Enter') doSearch(); });
q.addEventListener('input', function(){
  // 输入变化时重置匹配（避免旧匹配索引错乱）
  searchTerm = '';
  searchMatches = [];
  searchIndex = 0;
  clearHl();
});

// ===== AI 问答 板块逻辑 =====
// 语音输入：弃用 Web Speech API（华为/荣耀无谷歌服务，识别不可用）。
// 改用系统输入法键盘的麦克风：孩子点输入框→键盘麦克风→语音转文字自动填入→点「问 AI」。
var qaText = document.getElementById('qaText');
var qaTip = document.getElementById('qaTip');
var qaList = document.getElementById('qaList');

var SENDKEY = 'SCT408036TfIB8WYWqE1fccXXkARNAk1Aa';
var QA_STORE_KEY = 'beiji_ai_questions';

// 从 localStorage 读历史（持久化）
function loadQuestions() {
  var list = [];
  try {
    var raw = localStorage.getItem(QA_STORE_KEY);
    if (raw) { list = JSON.parse(raw); }
  } catch (e) { list = []; }
  return list;
}
function saveQuestions(list) {
  try { localStorage.setItem(QA_STORE_KEY, JSON.stringify(list)); } catch (e) {}
}

// 渲染对话历史（Q 右侧蓝气泡 / A 左侧灰气泡）——倒序，最新在最上面
function renderQuestions() {
  var list = loadQuestions();
  if (!list || list.length === 0) {
    qaList.innerHTML = '<div class="empty">还没有提问，把不懂的写进来问 AI 吧</div>';
    return;
  }
  var html = '';
  for (var i = list.length - 1; i >= 0; i--) {
    var it = list[i];
    html += '<div class="qa-item">';
    html += '<div class="qa-q">' + escHtml(it.q) + '</div>';
    if (it.a) {
      html += '<div class="qa-a">' + fmtAi(it.a) + '</div>';
    } else {
      html += '<div class="qa-a ai-thinking">（AI 思考中…）</div>';
    }
    html += '<div class="qa-time">' + escHtml(it.t) + '</div>';
    html += '</div>';
  }
  qaList.innerHTML = html;
}

// 轻量 Markdown → HTML（不加 KaTeX）
function fmtAi(s) {
  var out = escHtml(s);
  // 1. 代码块 ```...``` → 保留原样但换行
  out = out.replace(/```([\s\S]*?)```/g, function(m, c){ return '\n' + c + '\n'; });
  // 2. 行内公式 $...$ → 蓝色字
  out = out.replace(/\$([^$\n]+?)\$/g, '<span class="m">$1</span>');
  // 3. 加粗 **...** → <b>
  out = out.replace(/\*\*([^*\n]+?)\*\*/g, '<b>$1</b>');
  // 4. 标题 ### / ## / # → <b>
  out = out.replace(/^#{1,3}\s*(.*)$/gm, '<b>$1</b>');
  // 5. 列表 - / * → 点
  out = out.replace(/^(\s*)[-•*]\s+/gm, '$1· ');
  // 6. 兜底：把 AI 可能残留的 ^2 / ^3 / ^n 上标记号转成真上标字符
  out = out.replace(/\^2/g, '\u00B2');
  out = out.replace(/\^3/g, '\u00B3');
  // 把 _（下标/下限）后面的 {数字} 花括号去掉，保留数字（如 _{0}^{1} → 简单化）
  out = out.replace(/_{([^{}]+?)}/g, '$1');
  out = out.replace(/\^\{([^{}]+?)\}/g, '$1');
  // 残留的 ^ 和 _ 单独符号去掉（不影响普通文字）
  out = out.replace(/\^/g, '');
  // 智能平方上标：紧跟在字母/右括号后的裸 2、3 → ²、³
  out = out.replace(/([A-Za-z\)\]])(2)/g, '$1²');
  out = out.replace(/([A-Za-z\)\]])(3)/g, '$1³');
  // 7. 换行 → <br>
  out = out.replace(/\n/g, '<br>');
  return out;
}

function submitQuestion() {
  var t = qaText.value.trim();
  if (t === '') { qaTip.textContent = '请先输入问题'; return; }
  var time = new Date();
  var ts = time.getFullYear() + '-' + pad(time.getMonth()+1) + '-' + pad(time.getDate()) + ' ' + pad(time.getHours()) + ':' + pad(time.getMinutes());
  // 写入 localStorage（持久化，先存问题，答案留空）
  var list = loadQuestions();
  list.push({ q: t, a: '', t: ts });
  saveQuestions(list);
  renderQuestions();
  qaText.value = '';
  qaTip.textContent = '已提交，正在问 AI…';
  // ① 同时推送到家长微信（掌握孩子问了啥）
  sendToWechat(t, ts);
  // ② 同时问 AI，答案回填
  askAi(t, list.length - 1);
}
function pad(n){ return n < 10 ? '0' + n : '' + n; }
function escHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>'); }

var sendBtn = document.getElementById('sendBtn');
sendBtn.addEventListener('click', submitQuestion);

// 接收 Java 原生推送的真实结果（微信推送）
window.__wechatResult = function(r) {
  var tip = qaTip || document.getElementById('qaTip');
  if (!tip) return;
  if (r.indexOf('OK:') === 0) {
    tip.textContent = '已同步发送给家长 ✓';
  } else {
    tip.textContent = '发送给家长失败 · ' + r;
  }
};
window.__wechatCb = window.__wechatResult;

// Server酱推送：孩子的问题 -> 家长微信（走 beiji:// 自定义 scheme）
function sendToWechat(text, ts) {
  try {
    var title = encodeURIComponent('【毛豆】新提问 ' + ts);
    var desp = encodeURIComponent(text);
    var cb = '__wechatCb';
    var u = 'beiji://wechat?title=' + title + '&desp=' + desp + '&cb=' + cb;
    var f = document.createElement('iframe');
    f.style.display = 'none';
    f.src = u;
    document.body.appendChild(f);
    setTimeout(function(){ if (f.parentNode) f.parentNode.removeChild(f); }, 3000);
  } catch (e) {}
  return;
}

// 问 AI：走 beiji://ai 自定义 scheme，Java 原生请求 DeepSeek，答案回填到对话
function askAi(text, idx) {
  try {
    var q = encodeURIComponent(text);
    var cb = '__aiCb';
    var u = 'beiji://ai?q=' + q + '&idx=' + idx + '&cb=' + cb;
    var f = document.createElement('iframe');
    f.style.display = 'none';
    f.src = u;
    document.body.appendChild(f);
    setTimeout(function(){ if (f.parentNode) f.parentNode.removeChild(f); }, 3000);
  } catch (e) {
    setAiAnswer(idx, '问 AI 失败，请稍后再试');
  }
}

// 接收 AI 答案回填：answer 是答案文本，idx 是第几条
window.__aiCb = function(answer, idx) {
  if (answer === undefined) return;
  var i = parseInt(idx, 10);
  if (isNaN(i)) return;
  setAiAnswer(i, answer);
};

function setAiAnswer(idx, text) {
  var list = loadQuestions();
  if (list[idx]) {
    list[idx].a = text;
    saveQuestions(list);
    renderQuestions();
    var tip = qaTip;
    if (tip) tip.textContent = 'AI 已回答 ✓';
  }
}

// 初始化
renderQuestions();
switchTo('数学');
